name: ${STACK:-webui}

# OpenWebUI + Postgres (app DB) + Qdrant (vectors for RAG) + Redis
# (websockets, sessions, config cache).
#
# This stack is the chat surface your users see. It talks to:
#   - the gateway/ stack at $LITELLM_API_BASE for every model call (chat,
#     tasks, embeddings, rerank, images, audio)
#   - your IdP via OIDC, see docs/auth.md
#   - MCP / OpenAPI tool servers (mcps/), via HTTP
#   - optionally SearXNG + Firecrawl (web search) and a docling-compatible
#     extraction service (document upload), see docs/web-search.md
#
# The same file is the base for a fleet of instances: see webui/instances/.
# STACK names the instance and keeps router names / volumes apart.
#
# Image pinning: tags here are exact. In production also pin the digest
# (image: ...:v0.12.0@sha256:...) and let Renovate bump both.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.0
    # If you bake in customizations/ via the example Dockerfile, swap to:
    #   build:
    #     context: .
    #     dockerfile: customizations/Dockerfile.example
    restart: unless-stopped
    # Reap zombie processes (pandoc, document loaders) spawned per upload.
    init: true
    environment:
      WEBUI_NAME: ${WEBUI_NAME}
      WEBUI_URL: ${WEBUI_URL}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: user
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-false}

      # App DB. Postgres by default; to run on SQLite instead, remove this
      # line and the postgres service (see examples/postgres-vs-sqlite.md).
      DATABASE_URL: postgresql://openwebui:${OWUI_POSTGRES_PASSWORD}@postgres:5432/openwebui

      # All model traffic goes through the gateway. No provider keys here.
      # One virtual key per instance; users are attributed via the headers below.
      OPENAI_API_BASE_URL: ${LITELLM_API_BASE}
      OPENAI_API_KEY: ${LITELLM_VIRTUAL_KEY}
      ENABLE_OLLAMA_API: "false"
      # Send X-OpenWebUI-User-Id/-Email/-Name/-Role and X-OpenWebUI-Chat-Id
      # with every model and tool call. The gateway maps them to per-user
      # spend; tool servers can answer "who is asking" (e.g. a /me endpoint).
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"

      # RAG: embeddings through the gateway too, under an alias that NEVER
      # falls back (different embedding model = corrupted vector store).
      # Rerank the same way: admin UI -> Documents -> external reranker
      # pointed at the gateway's /v1/rerank with a house/rerank alias.
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${LITELLM_API_BASE}
      RAG_OPENAI_API_KEY: ${LITELLM_VIRTUAL_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-house/embed}

      # Vector DB for RAG.
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      ENABLE_QDRANT_MULTITENANCY_MODE: "true"

      # Sessions + websockets.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENABLE_WEBSOCKET_SUPPORT: "true"
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # The cleanup-loop lock must outlive the 120 s session-cleanup sleep,
      # otherwise the loop logs "Unable to renew session cleanup lock" and dies.
      WEBSOCKET_REDIS_LOCK_TIMEOUT: "180"
      # Reconnect stale pooled connections instead of killing the cleanup task.
      REDIS_HEALTH_CHECK_INTERVAL: "30"
      REDIS_SOCKET_KEEPALIVE: "true"

      # Encryption keys for sessions and OAuth state. Both 32-byte random.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OAUTH_SESSION_TOKEN_ENCRYPTION_KEY: ${WEBUI_SECRET_KEY}

      # Document uploads: retry pandoc unsandboxed when the image's pandoc
      # lacks embedded data files (.odt -> DOCX path, jgm/pandoc#8128).
      ALLOW_PANDOC_NO_SANDBOX: "true"
      # Image-generating models stream a base64 image in one SSE line; the
      # default buffer aborts at 128 KiB.
      CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE: "134217728"

      # --- OIDC + groups (empty defaults = local login only) ---
      # OIDC activates once provider URL, client id and secret are all set.
      # See docs/auth.md (login, roles) and docs/tiers.md (groups).
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP:-false}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${OIDC_DISCOVERY_URL:-}
      OAUTH_SCOPES: openid email profile groups
      ENABLE_OAUTH_ROLE_MANAGEMENT: ${ENABLE_OAUTH_ROLE_MANAGEMENT:-false}
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ALLOWED_ROLES: ${OAUTH_ALLOWED_ROLES:-ai-user,ai-admin}
      OAUTH_ADMIN_ROLES: ${OAUTH_ADMIN_ROLES:-ai-admin}
      ENABLE_OAUTH_GROUP_MANAGEMENT: ${ENABLE_OAUTH_GROUP_MANAGEMENT:-false}
      ENABLE_OAUTH_GROUP_CREATION: "false"
      OAUTH_GROUP_CLAIM: groups

      # --- Web search (optional, see docs/web-search.md) ---
      # SearXNG finds URLs, Firecrawl v2 fetches them as markdown.
      # OpenWebUI >= 0.9.2 speaks Firecrawl /v2 directly: no translation proxy.
      # ENABLE_WEB_SEARCH: "true"
      # WEB_SEARCH_ENGINE: searxng
      # SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      # WEB_LOADER_ENGINE: firecrawl
      # FIRECRAWL_API_BASE_URL: http://firecrawl-api:3002
      # FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}

      # --- Document extraction (optional, see docs/document-extraction.md) ---
      # CONTENT_EXTRACTION_ENGINE: docling
      # DOCLING_SERVER_URL: http://docling:5001

      # Note: most of the above are PersistentConfig. They seed a fresh DB;
      # afterwards the admin UI value in the DB wins. Change them in the UI.

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${STACK:-webui}-owui.rule=Host(`${WEBUI_DOMAIN}`)
      - traefik.http.routers.${STACK:-webui}-owui.entrypoints=websecure
      - traefik.http.routers.${STACK:-webui}-owui.tls=true
      - traefik.http.services.${STACK:-webui}-owui.loadbalancer.server.port=8080
      - traefik.docker.network=proxy
    networks:
      - proxy
      - backend
    volumes:
      - openwebui_data:/app/backend/data

  postgres:
    # Postgres 18 images keep data under /var/lib/postgresql/18/docker; mount
    # the parent directory. Migrating an existing pre-18 volume needs
    # pg_upgrade (or pgautoupgrade), not just a tag bump: see docs/operations.md.
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${OWUI_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui -d openwebui"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend
      # cost-tracker/ reads the user table (names for the spend dashboard).
      - ai-bus

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      # Real readiness (200 only once storage is loaded). No curl in the image.
      test: ["CMD-SHELL", "timeout 5 bash -c 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend
    volumes:
      - qdrant_data:/qdrant/storage
      # Snapshots default to /qdrant/snapshots, outside the storage volume:
      # without their own volume they vanish on every container recreate.
      - qdrant_snapshots:/qdrant/snapshots

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--aof-load-corrupt-tail-max-size", "4096"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
    volumes:
      - redis_data:/data

volumes:
  openwebui_data: {}
  postgres_data: {}
  qdrant_data: {}
  qdrant_snapshots: {}
  redis_data: {}

networks:
  proxy:
    external: true
  ai-bus:
    external: true
  backend: {}
