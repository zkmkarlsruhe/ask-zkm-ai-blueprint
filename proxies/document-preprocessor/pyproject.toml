[project]
name = "document-preprocessor"
version = "0.1.0"
description = "Convert uploaded office documents to clean text/PDF before they reach RAG."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Add your converter here, e.g.:
    # "docling>=2.0",
    # "pdfminer.six>=20240706",
]

[project.scripts]
document-preprocessor = "proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/proxy.py"]
sources = ["src"]
