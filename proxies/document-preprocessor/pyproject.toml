[project]
name = "document-preprocessor"
version = "0.1.0"
description = "docling-serve-compatible shim in front of a document-convert upstream."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
document-preprocessor = "proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/proxy.py"]
sources = ["src"]
