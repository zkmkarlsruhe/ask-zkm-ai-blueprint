name: gateway

# LiteLLM proxy — the one door outside.
#
# All model traffic from OpenWebUI (and anything else you build) goes through
# this. It speaks OpenAI's API on the inside and translates to whatever
# providers you register on the outside. Spend is logged per virtual key and
# per user (OpenWebUI forwards the user id in a header, see config.example.yaml),
# which is what cost-tracker/ joins against the OpenWebUI user table.
#
# Image pinning: the tag below is exact. In production also pin the digest
# (image: ghcr.io/berriai/litellm:v1.104.0@sha256:...) and let Renovate bump
# both. If you add hooks, build your own image from Dockerfile.example instead.
#
# Networks:
#   - "proxy" is your reverse-proxy network (Traefik, Caddy, nginx). Create it
#     once: `docker network create proxy`.
#   - "backend" is internal, for litellm <-> postgres <-> redis traffic.
#   - "ai-bus" is shared with webui/ and cost-tracker/ for DB reads; only
#     this stack's postgres joins it (alias litellm-db). Create it once:
#     `docker network create ai-bus`.

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    # With hooks baked in (see Dockerfile.example), swap to:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile.example
    restart: unless-stopped
    init: true
    command: ["--config", "/app/config/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORE_MODEL_IN_DB: "True"
      # Apply LiteLLM's schema migrations on start. There is no down-migration:
      # the way back from a bad upgrade is a DB restore, not a tag rollback.
      USE_PRISMA_MIGRATE: "True"
      # Bring your own provider keys — see .env.example for the full list.
      # Alternatively store them as named credentials in the DB (admin UI),
      # encrypted with LITELLM_SALT_KEY, and rotate them in one place.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACADEMIC_API_KEY_1: ${ACADEMIC_API_KEY_1:-}
      ACADEMIC_API_KEY_2: ${ACADEMIC_API_KEY_2:-}
      EU_PROVIDER_API_KEY: ${EU_PROVIDER_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/readiness', timeout=3).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      # Not on ai-bus: there, "postgres" could resolve to another stack's DB.
      - proxy
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm.rule=Host(`${GATEWAY_DOMAIN}`)
      - traefik.http.routers.litellm.entrypoints=websecure
      - traefik.http.routers.litellm.tls=true
      - traefik.http.services.litellm.loadbalancer.server.port=4000
      - traefik.docker.network=proxy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      backend: {}
      ai-bus:
        # Unique name on the shared network: cost-tracker/ reads spend logs
        # here. webui/'s Postgres is on ai-bus too, as <STACK>-db.
        aliases: [litellm-db]

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # Router state only (rpm/tpm counters), no response cache: cap memory, evict LRU.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data: {}
  redis_data: {}

networks:
  proxy:
    external: true
  ai-bus:
    external: true
  backend: {}
