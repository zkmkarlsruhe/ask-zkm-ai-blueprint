name: opac-mcp

services:
  opac-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: opac-mcp:local
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Your catalog. Placeholders by default; see README.
      OPAC_BASE_URL: ${OPAC_BASE_URL:-https://opac.example.org/aDISWeb/app}
      OPAC_PROFILE: ${OPAC_PROFILE:-SOPAC00}
      OPAC_CATALOG_NAME: ${OPAC_CATALOG_NAME:-the library catalog}
      OPAC_CATALOG_FOCUS: ${OPAC_CATALOG_FOCUS:-}
    ports:
      - "${MCP_PORT:-8002}:8000"   # remove in production; expose via docker network instead
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      # Add the docker network OpenWebUI is on so OWUI can reach us by service
      # name. Find your webui stack's backend network with `docker network ls`.
      # - webui_backend
