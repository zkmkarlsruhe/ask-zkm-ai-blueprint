[project]
name = "hello-world-mcp"
version = "0.1.0"
description = "Minimal FastMCP starter — copy and rename to build your own."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.0.10",
]

[project.scripts]
hello-world-mcp = "hello_world:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/hello_world.py"]
sources = ["src"]
