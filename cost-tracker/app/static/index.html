<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Reporter</title>
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #f0f0f0;
        }
        
        .btn.active {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
        }
        
        .date-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .date-inputs input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        #loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0066cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        table.dataTable {
            width: 100% !important;
        }
        
        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        
        .summary-item {
            flex: 1;
        }
        
        .summary-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .summary-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 AI Cost Reporter</h1>
        
        <div class="controls">
            <button class="btn" data-range="6h">Last 6 hours</button>
            <button class="btn" data-range="24h">Last 24 hours</button>
            <button class="btn active" data-range="7d">Last 7 days</button>
            <button class="btn" data-range="30d">Last 30 days</button>
            <button class="btn" data-range="90d">Last 90 days</button>
            <button class="btn" data-range="6m">Last 6 months</button>
            <button class="btn" data-range="1y">Last 1 year</button>
            
            <div class="date-inputs" style="margin-left: auto;">
                <input type="date" id="startDate">
                <span>to</span>
                <input type="date" id="endDate">
                <button class="btn" id="customApply">Apply</button>
            </div>
        </div>
        
        <div class="summary" id="summary" style="display: none;">
            <div class="summary-item">
                <div class="summary-label">Total Users</div>
                <div class="summary-value" id="totalUsers">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Cost</div>
                <div class="summary-value" id="totalCost">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Requests</div>
                <div class="summary-value" id="totalRequests">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Tokens</div>
                <div class="summary-value" id="totalTokens">0</div>
            </div>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading cost data...</p>
        </div>
        
        <table id="costsTable" class="display" style="display: none;">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Cost (USD)</th>
                    <th>Requests</th>
                    <th>Total Tokens</th>
                    <th>Prompt Tokens</th>
                    <th>Completion Tokens</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    
    <script>
        let dataTable;
        
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }
        
        function getDateRange(range) {
            const end = new Date();
            const start = new Date();
            
            switch(range) {
                case '6h':
                    start.setHours(start.getHours() - 6);
                    break;
                case '24h':
                    start.setDate(start.getDate() - 1);
                    break;
                case '7d':
                    start.setDate(start.getDate() - 7);
                    break;
                case '30d':
                    start.setDate(start.getDate() - 30);
                    break;
                case '90d':
                    start.setDate(start.getDate() - 90);
                    break;
                case '6m':
                    start.setMonth(start.getMonth() - 6);
                    break;
                case '1y':
                    start.setFullYear(start.getFullYear() - 1);
                    break;
            }
            
            return {
                start: formatDate(start),
                end: formatDate(end)
            };
        }
        
        async function loadData(startDate, endDate) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('costsTable').style.display = 'none';
            document.getElementById('summary').style.display = 'none';
            
            try {
                const response = await fetch(`/api/users/costs?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();
                
                // Update summary
                const totalCost = data.reduce((sum, row) => sum + row.total_cost_usd, 0);
                const totalRequests = data.reduce((sum, row) => sum + row.total_requests, 0);
                const totalTokens = data.reduce((sum, row) => sum + row.total_tokens, 0);
                
                document.getElementById('totalUsers').textContent = data.length;
                document.getElementById('totalCost').textContent = '$' + totalCost.toFixed(4);
                document.getElementById('totalRequests').textContent = totalRequests.toLocaleString();
                document.getElementById('totalTokens').textContent = totalTokens.toLocaleString();
                document.getElementById('summary').style.display = 'flex';
                
                // Destroy existing table
                if (dataTable) {
                    dataTable.destroy();
                }
                
                // Populate table
                const tbody = document.querySelector('#costsTable tbody');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.email}</td>
                        <td>${row.name}</td>
                        <td>${row.role}</td>
                        <td>$${row.total_cost_usd.toFixed(6)}</td>
                        <td>${row.total_requests}</td>
                        <td>${row.total_tokens.toLocaleString()}</td>
                        <td>${row.prompt_tokens.toLocaleString()}</td>
                        <td>${row.completion_tokens.toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                // Initialize DataTable
                dataTable = $('#costsTable').DataTable({
                    order: [[3, 'desc']], // Sort by cost descending
                    pageLength: 25
                });
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('costsTable').style.display = 'table';
                
            } catch (error) {
                document.getElementById('loading').innerHTML = `<p style="color: red;">Error loading data: ${error.message}</p>`;
            }
        }
        
        // Quick range buttons
        document.querySelectorAll('.btn[data-range]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn[data-range]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const range = getDateRange(this.dataset.range);
                document.getElementById('startDate').value = range.start;
                document.getElementById('endDate').value = range.end;
                
                loadData(range.start, range.end);
            });
        });
        
        // Custom date apply
        document.getElementById('customApply').addEventListener('click', function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (startDate && endDate) {
                document.querySelectorAll('.btn[data-range]').forEach(b => b.classList.remove('active'));
                loadData(startDate, endDate);
            }
        });
        
        // Load default (last 7 days) on page load
        window.addEventListener('DOMContentLoaded', function() {
            const range = getDateRange('7d');
            document.getElementById('startDate').value = range.start;
            document.getElementById('endDate').value = range.end;
            loadData(range.start, range.end);
        });
    </script>
</body>
</html>
